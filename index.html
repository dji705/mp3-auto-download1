        async function downloadSingle(url, name, btn) {
            if (btn) btn.innerText = '⏳...';
            try {
                const res = await fetch(`/api/download?url=${encodeURIComponent(url)}&name=${encodeURIComponent(name)}`);
                if (!res.ok) throw new Error('Download failed');
                const blob = await res.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = name;
                a.click();
                if (btn) { btn.innerText = '✅ ירד'; btn.style.background = '#a6e3a1'; }
            } catch(e) {
                if (btn) { btn.innerText = '❌ שגיאה'; btn.style.background = '#f38ba8'; }
                console.error(e);
            }
        }

        async function downloadAll() {
            const btns = document.querySelectorAll('.btn-dl');
            for (let i = 0; i < files.length; i++) {
                await downloadSingle(files[i].url, files[i].name, btns[i]);
                await new Promise(r => setTimeout(r, 1200));
            }
        }

        const listDiv = document.getElementById('file-list');
        files.forEach((f, i) => {
            const row = document.createElement('div');
            row.className = 'file-row';
            row.innerHTML = `<span class="file-name" title="${f.name}">${i + 1}. ${f.name}</span>
                             <button class="btn-dl" onclick="downloadSingle('${f.url}', '${f.name}', this)">הורד 📥</button>`;
            listDiv.appendChild(row);
        });
    </script>
